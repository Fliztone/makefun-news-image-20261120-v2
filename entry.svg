eorgia, 'Times New Roman', serif" font-size="15.5" font-weight="normal" font-style="normal" fill="#cfc7b6" text-anchor="start">13 years after GTA V, Rockstar’s Vice City sequel is out now — the biggest</text><text x="286" y="283" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="normal" font-style="normal" fill="#cfc7b6" text-anchor="start">entertainment debut in history, with more than $1.6 billion in pre-orders.</text><rect x="286" y="296" width="169" height="22" rx="11" fill="#0d1626" stroke="#ff8a5c" stroke-width="1"/><text x="370.5" y="311" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#ffd166" text-anchor="middle" letter-spacing="0.5">PS5 · XBOX SERIES X|S</text><rect x="465" y="296" width="155" height="22" rx="11" fill="#0d1626" stroke="#ff8a5c" stroke-width="1"/><text x="542.5" y="311" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#ffd166" text-anchor="middle" letter-spacing="0.5">BIGGEST LAUNCH EVER</text><rect x="28" y="348" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="28" y="348" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(440,364)"><g fill="none" stroke="#152238" stroke-width="2"><circle cx="24" cy="27" r="15"/><ellipse cx="24" cy="27" rx="6.5" ry="15"/><line x1="9" y1="27" x2="39" y2="27"/><path d="M11 19 H37 M11 35 H37"/></g><polygon points="13.0,2.8 14.1,5.5 17.0,5.7 14.8,7.6 15.5,10.4 13.0,8.9 10.5,10.4 11.2,7.6 9.0,5.7 11.9,5.5" fill="#b3261e"/><polygon points="24.0,0.4 25.2,3.3 28.4,3.6 26.0,5.6 26.7,8.7 24.0,7.1 21.3,8.7 22.0,5.6 19.6,3.6 22.8,3.3" fill="#b3261e"/><polygon points="35.0,2.8 36.1,5.5 39.0,5.7 36.8,7.6 37.5,10.4 35.0,8.9 32.5,10.4 33.2,7.6 31.0,5.7 33.9,5.5" fill="#b3261e"/></g><text x="46" y="381" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">DIPLOMACY · SHENZHEN</text><text x="46" y="409" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Trump, Xi &amp; Putin: peace pact</text><text x="46" y="435" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">First-ever US–China–Russia trilateral, held at</text><text x="46" y="455" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">APEC in Shenzhen. Joint ‘peace declaration’:</text><text x="46" y="475" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">‘A nuclear war cannot be won.’</text><rect x="520" y="348" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="520" y="348" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(932,364)"><g stroke="#152238" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 V40 H42"/><path d="M12 34 L20 26 L27 30 L38 14"/><path d="M31 14 H38 V21"/></g><rect x="13" y="30" width="4" height="8" fill="#b3261e" opacity="0.85"/><rect x="22" y="24" width="4" height="14" fill="#152238" opacity="0.55"/></g><text x="538" y="381" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">BUSINESS · ARTIFICIAL INTELLIGENCE</text><text x="538" y="409" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Anthropic’s record IPO</text><text x="538" y="435" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">Claude maker raises $81.3B at $83/share — the</text><text x="538" y="455" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">biggest IPO ever, topping SpaceX. ~$1.5T value;</text><text x="538" y="475" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">ANT closed +17% on its Nasdaq debut.</text><rect x="28" y="527" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="28" y="527" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(440,543)"><g fill="#152238"><rect x="6" y="26" width="36" height="11" rx="5"/><rect x="10" y="18" width="24" height="9" rx="2"/><rect x="17" y="12" width="12" height="7" rx="1.5"/><rect x="29" y="13.5" width="16" height="3" rx="1.5"/></g><g fill="#f5f0e6"><circle cx="12" cy="31.5" r="2.4"/><circle cx="19" cy="31.5" r="2.4"/><circle cx="26" cy="31.5" r="2.4"/><circle cx="33" cy="31.5" r="2.4"/><circle cx="38" cy="31.5" r="2.4"/></g><rect x="6" y="26" width="36" height="11" rx="5" fill="none" stroke="#152238" stroke-width="2"/></g><text x="46" y="560" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">MIDDLE EAST · GAZA</text><text x="46" y="588" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Israel’s Gaza ground raid</text><text x="46" y="614" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">Tank incursion into central Gaza despite the</text><text x="46" y="634" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">ceasefire; army says it is completed. Hamas</text><text x="46" y="654" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">calls it a ‘blatant ceasefire violation.’</text><rect x="520" y="527" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="520" y="527" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(932,543)"><g fill="none" stroke="#152238" stroke-width="2" stroke-linejoin="round"><path d="M9 24 L24 12 L39 24"/><path d="M12 23 V39 H36 V23"/><rect x="20" y="29" width="8" height="10"/></g><path d="M33 8 C36 12 39 13 38 18 C37.5 21 35 22 34 21 C35 19 34 17 32.5 16 C32 18 30.5 18.5 30.5 16.5 C30.5 13 32 11 33 8 Z" fill="#b3261e"/></g><text x="538" y="560" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">SOUTH ASIA · BANGLADESH</text><text x="538" y="588" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Bangladesh shutdown</text><text x="538" y="614" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">Hasina’s banned party enforces a lockdown; two</text><text x="538" y="634" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">ruling-party members killed. Yunus’s ancestral</text><text x="538" y="654" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">home torched in Chattogram.</text><rect x="28" y="706" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="28" y="706" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(440,722)"><g fill="none" stroke="#152238" stroke-width="5.5" stroke-linecap="round"><path d="M24 24 C24 15 31 10 38 13 C43 15 44 21 40 25"/><path d="M24 24 C24 33 17 38 10 35 C5 33 4 27 8 23"/></g><circle cx="24" cy="24" r="3.6" fill="#b3261e"/></g><text x="46" y="739" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">CLIMATE · INDIA</text><text x="46" y="767" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Cyclone Akvan landfall</text><text x="46" y="793" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">Severe storm hits the Andhra–Odisha coast today;</text><text x="46" y="813" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">50,000+ evacuated, schools shut, trains cancelled.</text><text x="46" y="833" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">Red alert for extremely heavy rain.</text><rect x="520" y="706" width="476" height="165" rx="7" fill="#fbf8f0" stroke="#ddd5c2" stroke-width="1.5"/><rect x="520" y="706" width="5" height="165" rx="2" fill="#b3261e"/><g transform="translate(932,722)"><rect x="7" y="9" width="34" height="30" rx="2" fill="none" stroke="#152238" stroke-width="2.5"/><rect x="12" y="14" width="24" height="20" fill="#f5f0e6" stroke="#152238" stroke-width="1"/><rect x="22.5" y="24" width="3" height="8" fill="#152238"/><circle cx="24" cy="21" r="6.5" fill="#152238" opacity="0.85"/><circle cx="19" cy="24" r="3.4" fill="#152238" opacity="0.6"/><circle cx="29" cy="24" r="3.4" fill="#152238" opacity="0.6"/><line x1="12" y1="32" x2="36" y2="32" stroke="#b3261e" stroke-width="1.5"/></g><text x="538" y="739" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b3261e" text-anchor="start" letter-spacing="0.8">CULTURE · NEW YORK</text><text x="538" y="767" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Van Gogh record: $190.4M</text><text x="538" y="793" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">‘Blossoming Chestnut Trees’ sets the artist’s</text><text x="538" y="813" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">auction record at Sotheby’s, after a Nazi-era</text><text x="538" y="833" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="normal" font-style="normal" fill="#2b2b2b" text-anchor="start">restitution settlement cleared the sale.</text><rect x="28" y="884" width="968" height="62" rx="7" fill="#152238"/><rect x="44" y="902" width="70" height="26" rx="13" fill="#b3261e"/><text x="79" y="920" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPORT</text><text x="130" y="911" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#f3ede0" text-anchor="start">CRICKET · NZ v IND, 1st Test (Wellington): Nicholls 113* — Kiwis fight back to 243/5 on Day 1</text><text x="130" y="931" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#f3ede0" text-anchor="start">CHESS · Gukesh v Sindarov, world title defence, Geneva, from Nov 24   ·   ATHLETICS · Jepchirchir banned 3 yrs (EPO)</text><line x1="28" y1="958" x2="996" y2="958" stroke="#ddd5c2" stroke-width="1"/><text x="512" y="978" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal"